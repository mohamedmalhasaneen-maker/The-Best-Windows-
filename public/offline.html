<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <title>The Best Windows | وضع عدم الاتصال</title>
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
        background: #0F172A;
        color: #F8FAFC;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 460px;
        background: #FFFFFF;
        color: #0F172A;
        border-radius: 24px;
        border: 2px solid #F59E0B;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
      }
      .logo {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        border: 3px solid #F59E0B;
        object-fit: cover;
        margin: 0 auto 18px;
        display: block;
        background: #FFFFFF;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #FEF3C7;
        color: #92400E;
        border: 1px solid #FCD34D;
        font-weight: 800;
        font-size: 12px;
        padding: 6px 14px;
        border-radius: 10px;
        margin-bottom: 14px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: #D97706;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 900;
        color: #0F172A;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.7;
        color: #475569;
        font-weight: 600;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn-primary {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 13px 18px;
        background: #F59E0B;
        color: #0F172A;
        font-size: 14px;
        font-weight: 900;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      .btn-secondary {
        width: 100%;
        border: 2px solid #E2E8F0;
        border-radius: 14px;
        padding: 12px 18px;
        background: #F8FAFC;
        color: #0F172A;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/pwa-192x192.png" alt="The Best Windows" class="logo" />
      <div class="badge">
        <span class="dot"></span>
        <span>لا يوجد اتصال بالإنترنت</span>
      </div>
      <h1>The Best Windows</h1>
      <p>
        تعذر تحميل هذه الصفحة أثناء انقطاع الاتصال. يمكنك فتح التطبيق المحفوظ محليًا لمتابعة حساب البنود وعروض الأسعار وتصدير ملفات PDF، أو إعادة المحاولة عند عودة الإنترنت.
      </p>
      <div class="actions">
        <a href="/" class="btn-primary">فتح التطبيق المحفوظ محليًا</a>
        <button type="button" class="btn-secondary" onclick="window.location.reload()">
          إعادة المحاولة الآن
        </button>
      </div>
    </main>
  </body>
</html>
